<body>
<div class="splash" id="splash" aria-hidden="true"><img src="icons/icon.svg" alt="" width="100" height="100"></div>
<div class="wrap">
  <header class="top" id="topbar">
    <div class="bar-side"></div>
    <div class="mini-title" id="miniTitle" aria-hidden="true"></div>
    <div class="top-right" id="topRight" hidden>
      <button class="iconbtn" type="button" data-act="settings" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <div class="brand" id="brand">
    <h1 id="pageTitle">Kartenscanner</h1>
    <div class="subtitle" id="subtitle" hidden>Sammlung <b id="worth">–</b></div>
  </div>

  <main id="view-auth" class="stack"></main>

  <main id="view-scan" class="stack" hidden></main>

  <main id="view-inv" class="stack" hidden>
    <div class="stats" id="invStats"></div>
    <div id="invPrices"></div>
    <div class="toolbar">
      <input class="field" id="invSearch" type="search" placeholder="Suchen" autocomplete="off">
      <select class="field" id="invSort" aria-label="Sortierung">
        <option value="value">Wert</option>
        <option value="new">Neueste</option>
        <option value="name">Name</option>
        <option value="set">Set</option>
      </select>
    </div>
    <div id="invGrid"></div>
  </main>

  <main id="view-sets" class="stack" hidden></main>

  <main id="view-value" class="stack" hidden></main>

  <main id="view-hist" class="stack" hidden></main>
</div>

<nav class="nav" id="nav" aria-label="Bereiche" hidden>
  <div class="in">
    <button type="button" data-tab="scan" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8.5" y="7" width="7" height="10" rx="1"/></svg>
      <span>Scannen<span id="navDot"></span></span>
    </button>
    <button type="button" data-tab="inv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7" height="9" rx="1"/><rect x="14" y="4" width="7" height="9" rx="1"/><path d="M3 17h18M3 21h18"/></svg>
      <span>Inventar</span>
    </button>
    <button type="button" data-tab="sets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="11" height="15" rx="1.5"/><path d="M4 7v12.5A1.5 1.5 0 0 0 5.5 21H15"/><path d="M10 14l2 2 4-5"/></svg>
      <span>Sets</span>
    </button>
    <button type="button" data-tab="value">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/><path d="M16 7h4v4"/></svg>
      <span>Wert</span>
    </button>
    <button type="button" data-tab="hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
      <span>Verlauf</span>
    </button>
  </div>
</nav>

<div id="sheetRoot"></div>

<div id="camera" class="camera" hidden>
  <video id="camVideo" playsinline muted autoplay></video>
  <div class="cam-frame" id="camFrame"><span></span><div class="cam-price" id="camPrice"></div></div>
  <div class="cam-top">
    <span id="camCount">Karte in den Rahmen legen</span>
    <div class="cam-tools">
      <button class="cam-tog" type="button" data-act="cam-auto" id="camAutoBtn" aria-pressed="true">Auto</button>
      <button class="cam-tog" type="button" data-act="cam-sound" id="camSoundBtn" aria-pressed="true">Ton</button>
      <button class="x" type="button" data-act="cam-close" aria-label="Kamera schließen">×</button>
    </div>
  </div>
  <div class="cam-feed" id="camFeed" aria-live="polite"></div>
  <div class="cam-bottom"><div class="cam-sum" id="camSum"></div><button class="shutter" type="button" data-act="cam-shot" aria-label="Foto aufnehmen"></button></div>
  <div class="cam-flash" id="camFlash"></div>
</div>

<input id="camFallback" type="file" accept="image/*" capture="environment" hidden>
<input id="galIn" type="file" accept="image/*" multiple hidden>
<input id="importIn" type="file" accept="application/json,.json" hidden>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
