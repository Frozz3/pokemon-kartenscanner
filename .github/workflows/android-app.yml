# Builds the Android app (.apk) in the cloud and publishes it as the release "android-latest".
# Install it on the phone by opening the download link and allowing installs from the browser.
#
# Instance settings (repository variables): SUPABASE_URL, SUPABASE_KEY, optional APP_ID, APP_NAME.
# Signing (repository secrets): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# optional ANDROID_KEY_PASSWORD (default: keystore password). Without them a debug-signed APK is built,
# which cannot be updated in place. See README, "Android-App".
# Supply chain: only GitHub's own actions, pinned to exact commits; no third-party actions.
name: Android-App bauen

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "supabase/**", "sw.js", "icons/splash/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      APP_ID: ${{ vars.APP_ID }}
      APP_NAME: ${{ vars.APP_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Web-App und Einstellungen dieser Instanz
        run: node scripts/build-web.mjs "${{ github.run_number }}"

      - name: Android-Projekt erzeugen und anpassen
        run: |
          npx cap add android
          bash scripts/android-customize.sh "${{ github.run_number }}"
          npx cap sync android

      - name: App bauen
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          cd android
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
              --key-pass "env:$([ -n "$KS_KEYPASS" ] && echo KS_KEYPASS || echo KS_PASS)" \
              --out "$RUNNER_TEMP/Kartenscanner.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.jks"
            "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/Kartenscanner.apk" | head -3
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt: es wird eine Debug-APK gebaut. Updates lassen sich dann nicht über die alte App installieren (siehe README)."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Kartenscanner.apk"
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
          ls -la "$RUNNER_TEMP/Kartenscanner.apk"

      - name: Als Release „android-latest" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Android-App, gebaut aus ${{ github.sha }}. Installation: Kartenscanner.apk auf dem Handy herunterladen und öffnen (Installation aus dieser Quelle erlauben)."
          if [ "$SIGNED" = "debug" ]; then NOTE="$NOTE ACHTUNG: Debug-Signatur, vor einem Update die alte App deinstallieren."; fi
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "$RUNNER_TEMP/Kartenscanner.apk" \
            --target "${{ github.sha }}" --latest=false \
            --title "Android-App (Build ${{ github.run_number }})" \
            --notes "$NOTE"
