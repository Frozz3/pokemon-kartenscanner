# Builds the iOS app (unsigned .ipa) on a Mac in the cloud and publishes it as the release "ios-latest".
# Install it on the iPhone from a Windows PC with Sideloadly (it signs with your Apple ID).
# Supply chain: only GitHub's own actions, pinned to exact commits; no third-party actions.
name: iOS-App bauen

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "supabase/**", "sw.js", "icons/splash/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-app
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Neuestes stabiles Xcode wählen
        run: |
          X=$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE "beta|rc" | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Web-App für die App vorbereiten
        run: node scripts/build-web.mjs "${{ github.run_number }}"

      - name: iOS-Projekt erzeugen und anpassen
        run: |
          npx cap add ios
          bash scripts/ios-customize.sh
          npx cap sync ios

      - name: App bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Kartenscanner.ipa" Payload)
          ls -la "$RUNNER_TEMP/Kartenscanner.ipa"

      - name: Als Release „ios-latest" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest "$RUNNER_TEMP/Kartenscanner.ipa" \
            --target "${{ github.sha }}" \
            --title "iOS-App (Build ${{ github.run_number }})" \
            --notes "Unsignierte iOS-App zum Sideloaden, gebaut aus ${{ github.sha }}. Installation: Kartenscanner.ipa herunterladen und mit Sideloadly auf das iPhone spielen (Anleitung in der README)."
